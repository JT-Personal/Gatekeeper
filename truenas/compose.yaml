# Paste into TrueNAS SCALE Apps > Discover Apps > Install via YAML.
# Set the database password and pick the Git ref before installing.
x-gatekeeper-db-password: &db-password "replace-with-a-strong-unique-password"

services:
  gatekeeper:
    build:
      context: https://github.com/JT-Personal/Gatekeeper.git#main
    pull_policy: build
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: *db-password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: *db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
