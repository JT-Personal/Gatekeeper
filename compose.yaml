services:
  gatekeeper:
    image: gatekeeper:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      AUTH_MODE: "${AUTH_MODE:-trusted}"
      AUTH_ISSUER: "${AUTH_ISSUER:-}"
      AUTH_CLIENT_ID: "${AUTH_CLIENT_ID:-}"
      AUTH_CLIENT_SECRET: "${AUTH_CLIENT_SECRET:-}"
      AUTH_APP_URL: "${AUTH_APP_URL:-}"
      AUTH_ALLOWED_GROUP:
      AUTH_ADMIN_GROUP: "${AUTH_ADMIN_GROUP:-gatekeeper-admins}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
